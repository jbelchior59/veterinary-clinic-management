services:
  backend:
    build:
      context: ./backend
    environment:
      NODE_ENV: production
      DATABASE_URL: file:/app/data/dev.db
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: 8h
      FRONTEND_URL: http://localhost
    volumes:
      - db_data:/app/data
    ports:
      - "3000:3000"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  db_data:
